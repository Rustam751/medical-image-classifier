# Central configuration for the Medical Image Disease Classifier.
# Any value can be overridden at runtime via environment variables of the form
# MIC_<SECTION>_<FIELD>, e.g. MIC_TRAINING_EPOCHS=20 or MIC_API_PORT=9000.

paths:
  data_dir: data
  synthetic_dir: data/synthetic
  models_dir: models
  reports_dir: reports
  samples_dir: samples

data:
  image_size: 128
  per_class_train: 180
  per_class_val: 45
  per_class_test: 45
  seed: 42

model:
  architecture: small_cnn
  dropout: 0.4

training:
  epochs: 12
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 4
  seed: 42
  num_workers: 0

api:
  title: Medical Image Disease Classifier API
  host: 0.0.0.0
  port: 8000
  model_path: models/model.pt
  max_upload_bytes: 10485760  # 10 MB
  log_level: INFO
