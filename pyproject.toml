[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-classifier-api"
version = "0.1.0"
description = "Production-style medical image disease classifier served as an API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
keywords = ["machine-learning", "computer-vision", "fastapi", "pytorch", "medical-imaging"]

# Runtime dependencies are pinned in requirements.txt for reproducible installs.
# They are mirrored loosely here so the package is pip-installable on its own.
dependencies = [
  "torch>=2.2",
  "numpy>=1.26,<2.0",
  "pillow>=10",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "streamlit>=1.36"]

[project.scripts]
mic-train = "medical_classifier.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls (File(...)) in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
